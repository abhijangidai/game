<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 160" width="340" height="160" role="img">
  <defs>
    <linearGradient id="rfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5A36"/>
      <stop offset="55%" stop-color="#FF7A3D"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="340" height="160" rx="0" fill="url(#rfBg)"/>
  <!-- speed lines -->
  <g opacity="0.18" stroke="white" stroke-linecap="round">
    <line x1="18" y1="72" x2="88" y2="72" stroke-width="3"/>
    <line x1="12" y1="82" x2="72" y2="82" stroke-width="2.5"/>
    <line x1="22" y1="92" x2="92" y2="92" stroke-width="3"/>
    <line x1="252" y1="58" x2="322" y2="58" stroke-width="2.5"/>
    <line x1="262" y1="68" x2="322" y2="68" stroke-width="3"/>
    <line x1="248" y1="78" x2="318" y2="78" stroke-width="2"/>
  </g>
  <!-- car silhouette -->
  <g filter="url(#shadow)" transform="translate(108,62)">
    <path d="M 8 28 L 8 18 L 22 14 L 48 12 L 68 14 L 96 18 L 108 22 L 108 28 L 102 34 L 22 34 L 8 28 Z" fill="url(#carGrad)"/>
    <path d="M 24 14 L 38 6 L 68 6 L 82 14 Z" fill="white" opacity="0.95"/>
    <path d="M 40 8 L 50 8 L 64 8 L 78 14 L 28 14 Z" fill="#0f172a" opacity="0.9"/>
    <!-- wheels -->
    <circle cx="28" cy="34" r="10" fill="#0f172a"/>
    <circle cx="28" cy="34" r="5.5" fill="#e2e8f0"/>
    <circle cx="28" cy="34" r="2.2" fill="#0f172a"/>
    <circle cx="92" cy="34" r="10" fill="#0f172a"/>
    <circle cx="92" cy="34" r="5.5" fill="#e2e8f0"/>
    <circle cx="92" cy="34" r="2.2" fill="#0f172a"/>
    <!-- lights -->
    <rect x="104" y="19" width="4" height="6" rx="1" fill="#fff7a0"/>
    <rect x="8" y="20" width="3" height="5" rx="1" fill="#ff3b30"/>
  </g>
  <!-- text -->
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="170" y="132" font-size="22" font-weight="900" fill="white" letter-spacing="3.5" style="font-style:italic">ROAD FURY</text>
    <text x="170" y="144" font-size="8.5" font-weight="700" fill="white" opacity="0.9" letter-spacing="4">STAGES • 100 LEVELS</text>
  </g>
</svg>
