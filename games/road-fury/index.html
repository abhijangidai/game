<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Fury – Stages</title>
<style>
:root{--bg:#10131a;--panel:#1b2030;--text:#eef1f7;--muted:#9aa3b8;--accent:#ff5a36;--btn:rgba(255,255,255,.16);--btn-on:rgba(255,90,54,.7);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--panel:#1b2030;--text:#eef1f7}}
:root[data-theme="dark"]{--bg:#10131a;--panel:#1b2030;--text:#eef1f7}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#ui>*{pointer-events:auto}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:clamp(8px,2vh,16px);background:rgba(10,12,18,.8);text-align:center}
.screen.on{display:flex}
h1{font-size:clamp(26px,6vw,58px);margin:0;letter-spacing:.04em;color:var(--accent)}
p{margin:0;color:var(--muted);font-size:clamp(13px,1.6vw,18px);max-width:560px;padding:0 16px;line-height:1.5}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:clamp(9px,1.8vh,14px) clamp(22px,4vw,48px);font-size:clamp(15px,2vw,22px);font-weight:700;cursor:pointer}
.btn.alt{background:var(--panel);border:1px solid var(--muted)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;width:min(92vw,720px);max-height:58vh;overflow-y:auto;touch-action:pan-y;padding:4px}
.st{background:var(--panel);color:var(--text);border:1px solid var(--muted);border-radius:8px;padding:12px 0;font-weight:700;cursor:pointer}
.st:disabled{opacity:.3;cursor:default}
#hud{position:absolute;top:8px;left:8px;right:8px;display:none;flex-direction:column;gap:6px;pointer-events:none!important}
#hud.on{display:flex}
#hud .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#hud button{pointer-events:auto}
.chip{background:var(--panel);border-radius:10px;padding:6px 12px;font:600 clamp(11px,1.4vw,24px) ui-monospace,Menlo,Consolas,monospace;white-space:pre;line-height:1.4}
#bar{position:relative;height:10px;background:var(--panel);border-radius:6px;margin:0 6px}
#bar i{position:absolute;top:-3px;width:6px;height:16px;border-radius:3px;background:#888;margin-left:-3px}
#bar i.me{background:var(--accent);width:8px}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(60px,18vw,160px);font-weight:900;color:#fff;text-shadow:0 4px 20px #000;pointer-events:none!important}
#count.on{display:flex}
#hpbar{height:12px;background:var(--panel);border-radius:6px;margin:0 6px;overflow:hidden}
#hpfill{height:100%;width:100%;background:#3ddc84;transition:width .15s}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 18px;border-radius:10px;font-weight:700;font-size:clamp(13px,2vw,20px);display:none;pointer-events:none!important;white-space:nowrap}
#toast.on{display:block}
#rot{display:none;position:absolute;top:100px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--text);padding:6px 12px;border-radius:10px;font-size:12px;text-align:center;pointer-events:none!important}
@media (pointer:coarse) and (orientation:portrait){#rot{display:block}}
#store{justify-content:space-between;padding:10px 0;background:linear-gradient(rgba(10,12,18,.55),rgba(10,12,18,0) 35%,rgba(10,12,18,.9) 70%)}
#cars{display:flex;gap:10px;overflow-x:auto;padding:10px 12px;touch-action:pan-x;width:100%;box-sizing:border-box}
.card{flex:0 0 clamp(150px,22vw,210px);background:var(--panel);border:2px solid transparent;border-radius:12px;padding:10px;text-align:left;cursor:pointer;color:var(--text)}
.card.sel{border-color:var(--accent)}
.card h3{margin:6px 0;font-size:15px}
.sw{height:10px;border-radius:5px}
.stat{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin:3px 0}
.stat span{width:58px}
.stat b{flex:1;height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.stat i{display:block;height:100%;background:var(--accent)}
.pr{margin-top:6px;font-weight:700;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
#paints{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:4px 8px}
.pal{width:30px;height:30px;border-radius:50%;border:2px solid #fff;cursor:pointer;padding:0}
#bSkill{right:calc(max(20px,3vw) + min(22vw,96px));bottom:calc(max(24px,5vh) + 2*min(22vw,96px))}
@media (max-height:430px){.screen{gap:6px}h1{font-size:26px}p{font-size:12px;line-height:1.3}.btn{padding:8px 22px;font-size:15px}#grid{max-height:46vh}}
#touch{position:absolute;inset:0;display:none;pointer-events:none!important}
#touch.on{display:block}
#touch>*{pointer-events:auto}
#stick{position:absolute;left:max(24px,4vw);bottom:max(24px,5vh);width:min(34vw,160px);height:min(34vw,160px);border-radius:50%;background:var(--btn);border:2px solid rgba(255,255,255,.25)}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(255,255,255,.55)}
.tbtn{position:absolute;width:min(20vw,84px);height:min(20vw,84px);border-radius:50%;background:var(--btn);border:2px solid rgba(255,255,255,.25);color:#fff;font:700 clamp(11px,3vw,15px) system-ui;display:flex;align-items:center;justify-content:center}
.tbtn.on{background:var(--btn-on)}
#bGas{right:max(20px,3vw);bottom:max(24px,5vh)}
#bBrake{right:calc(max(20px,3vw) + min(22vw,96px));bottom:max(24px,5vh)}
#bAtk{right:max(20px,3vw);bottom:calc(max(24px,5vh) + min(22vw,96px))}
#bBlk{right:calc(max(20px,3vw) + min(22vw,96px));bottom:calc(max(24px,5vh) + min(22vw,96px))}
</style>
</head>

      for (let m = 0; m < 3; m++) { o.position.set(a.x - Math.cos(a.h) * h.l, B[m] * h.sc + (m === 1 ? 0 : bob), a.z + Math.sin(a.h) * h.l); o.updateMatrix(); this.hm[m].setMatrixAt(i, o.matrix); }
      any = true;
    }
    if (any) for (const m of this.hm) m.instanceMatrix.needsUpdate = true;
  }
  follow(dt, snap) {
    const p = this.p, a = this.at(p.s), f = { x: Math.sin(a.h), z: Math.cos(a.h) }, m = this.pcar.position;
    const tx = m.x - f.x * 11, tz = m.z - f.z * 11;
    const k = snap ? 1 : 1 - Math.pow(.0008, dt);
    this.cam.position.x += (tx - this.cam.position.x) * k; this.cam.position.y += (5.5 - this.cam.position.y) * k; this.cam.position.z += (tz - this.cam.position.z) * k;
    this.cam.lookAt(m.x + f.x * 8, 1.6, m.z + f.z * 8);
    const f0 = this.cam.aspect < 1.3 ? Math.min(100, 62 * 1.3 / Math.max(this.cam.aspect, .5)) : 62, fov = f0 + p.v / MAXV * 14; if (Math.abs(fov - this.cam.fov) > .05) { this.cam.fov = fov; this.cam.updateProjectionMatrix(); }
    this.sun.position.set(m.x + 40, 80, m.z + 30); this.sun.target.position.copy(m);
    this.far.position.set(m.x, 0, m.z); this.ground.position.set(m.x, 0, m.z); this.sky.position.copy(this.cam.position); this.people(performance.now() / 1000);
  }
  hud() {
    const p = this.p, pos = 1 + this.rivals.filter(r => r.s > p.s).length, tm = Math.floor(this.t / 60) + ":" + (this.t % 60).toFixed(1).padStart(4, "0");
    $("info").textContent = `STAGE ${this.stage}\n${this.th.n}`;
    $("stat").textContent = `HP ${Math.max(0, Math.round(this.hp))}%  TIME ${tm}\n${Math.round(p.v * 3.6)} km/h  ${(Math.max(0, this.T.L - p.s) / 1000).toFixed(1)} km left
${SK[this.save.sel]}: ${this.skcd > 0 ? Math.ceil(this.skcd) + "s" : "READY (E)"}`;
    const bar = $("bar"), need = 1;
    while (bar.children.length < need) bar.insertBefore(document.createElement("i"), this.me);
    while (bar.children.length > need) bar.removeChild(bar.firstChild);
    this.me.style.left = clamp(p.s / this.T.L, 0, 1) * 100 + "%";
    const hf = $("hpfill"); hf.style.width = Math.max(0, this.hp) + "%"; hf.style.background = this.hp > 50 ? "#3ddc84" : this.hp > 25 ? "#f2c230" : "#ff4a4a";
  }
  loop(t) {
    requestAnimationFrame(tt => this.loop(tt));
    const raw = (t - this.last) / 1000, dt = Math.min(raw, .05); this.last = t;
    if (raw < .25 && (this.mode === "race" || this.mode === "count")) {
      this._fa = (this._fa || 0) + raw; this._fc = (this._fc || 0) + 1;
      if (this._fa > 2) { const f = this._fc / this._fa; this._fa = this._fc = 0; if (f < 42 && this.pr > .75) { this.pr = Math.max(.75, this.pr - .25); this.resize(); } else if (f > 57 && this.pr < this.pmax) { this.pr = Math.min(this.pmax, this.pr + .25); this.resize(); } }
    }
    if (this.mode === "pause") this.input.update();
    if (this.mode === "count") {
      this.cd -= dt; $("count").textContent = Math.ceil(this.cd);
      if (this.cd <= 0) { this.show("race"); $("count").textContent = "GO!"; $("count").classList.add("on"); setTimeout(() => $("count").classList.remove("on"), 700); }
    }
    if (this.mode === "race") { this.update(dt); if ((this.frame++ & 7) === 0) this.hud(); }
    if (!["menu", "sel", "store"].includes(this.mode)) this.follow(dt);
    else { const a = this.frame++ * .002; this.cam.position.set(Math.sin(a) * 14, 5, Math.cos(a) * 14 - 8); this.cam.lookAt(0, this.mode === "store" ? -1.5 : 1, 0); this.sky.position.copy(this.cam.position); }
    this.r.render(this.scene, this.cam);
  }
}
window.game = new Game();
